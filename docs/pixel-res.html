<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What resolution is</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Lato','Helvetica Neue',Helvetica,Arial,sans-serif;color:#2d3b45;background:#fff;
       line-height:1.5;padding:14px}
  .wrap{max-width:640px;margin:0 auto}

  .frame{border:1px solid #c7cdd1;border-radius:4px;overflow:hidden;background:#eef1f2;line-height:0}
  .frame canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}

  .readout{display:flex;gap:10px;margin:12px 0 4px}
  .cell{flex:1;border:1px solid #c7cdd1;border-radius:4px;padding:10px;text-align:center}
  .n{font-size:1.5em;font-weight:700;color:#0374b5;font-variant-numeric:tabular-nums;line-height:1.15}
  .l{font-size:.7em;color:#667;text-transform:uppercase;letter-spacing:.5px}

  .controls{margin-top:14px}
  .controls label{display:block;font-weight:600;font-size:.9em;margin-bottom:8px}
  input[type=range]{width:100%;height:6px;border-radius:3px;background:#c7cdd1;outline:none;
    -webkit-appearance:none;appearance:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
    background:#0374b5;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.25);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#0374b5;
    border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.25);cursor:pointer}
  .ends{display:flex;justify-content:space-between;font-size:.72em;color:#8a949a;margin-top:4px}

  .note{margin-top:14px;font-size:.88em;color:#3d4a52;border-left:3px solid #0374b5;
        background:#f5f7f8;padding:10px 13px;border-radius:0 4px 4px 0}
  .cap{font-size:.74em;color:#8a949a;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">

  <div class="frame"><canvas id="main" width="640" height="440"></canvas></div>

  <div class="readout">
    <div class="cell"><div class="n" id="dimOut">&mdash;</div><div class="l">pixels wide × high</div></div>
    <div class="cell"><div class="n" id="mpOut">&mdash;</div><div class="l">pixels in total</div></div>
  </div>

  <div class="controls">
    <label for="px">Drag to change how many pixels the image is made of</label>
    <input type="range" id="px" min="0" max="1000" value="1000">
    <div class="ends"><span>fewer pixels</span><span>more pixels</span></div>
  </div>

  <div class="note" id="note">&mdash;</div>

  <p class="cap">Hokusai, <em>The Great Wave off Kanagawa</em> (c.1831). Public domain, via Wikimedia Commons.</p>
</div>

<script>
(function(){
  var main = document.getElementById('main'), ctx = main.getContext('2d');
  var slider = document.getElementById('px');
  var MAX_PX = 1280, MIN_PX = 12;
  var img = new Image(), ready = false, ratio = 440/640;

  img.crossOrigin = 'anonymous';
  img.onload = function(){
    ready = true;
    ratio = img.naturalHeight / img.naturalWidth;
    main.height = Math.round(main.width * ratio);
    update();
  };
  img.onerror = function(){ ready = false; update(); };
  img.src = 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/' +
            'The_Great_Wave_off_Kanagawa.jpg/1280px-The_Great_Wave_off_Kanagawa.jpg';

  function fallback(c,w,h){
    var g=c.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'#0b3d66'); g.addColorStop(.5,'#7fc4e8'); g.addColorStop(1,'#f2e6c9');
    c.fillStyle=g; c.fillRect(0,0,w,h);
  }

  function update(){
    var t = parseInt(slider.value,10)/1000;
    var nx = Math.round(MIN_PX * Math.pow(MAX_PX/MIN_PX, t));
    var ny = Math.max(2, Math.round(nx*ratio));

    var off = document.createElement('canvas');
    off.width = nx; off.height = ny;
    var octx = off.getContext('2d');
    octx.imageSmoothingEnabled = true;
    octx.imageSmoothingQuality = 'high';
    if(ready) octx.drawImage(img,0,0,nx,ny); else fallback(octx,nx,ny);

    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0,0,main.width,main.height);
    ctx.drawImage(off,0,0,nx,ny,0,0,main.width,main.height);

    document.getElementById('dimOut').textContent = nx.toLocaleString()+' × '+ny.toLocaleString();
    var total = nx*ny;
    document.getElementById('mpOut').textContent =
      total>=1000000 ? (total/1000000).toFixed(1)+' million' : total.toLocaleString();

    var note = document.getElementById('note');
    if(nx >= 800){
      note.innerHTML = 'Enough pixels to hold the fine detail: the spray at the top of the wave, the lines in the boats.';
    } else if(nx >= 300){
      note.innerHTML = 'The picture still reads, but the fine detail has gone. Look at the spray.';
    } else if(nx >= 90){
      note.innerHTML = 'You can now see the individual pixels as squares. This is <strong>pixelation</strong>.';
    } else {
      note.innerHTML = 'Only blocks of flat colour are left. You recognise the shape because you already know the picture, not because the detail is there.';
    }
  }

  slider.addEventListener('input', update);
  update();
})();
</script>
</body>
</html>
