<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D Design — Assigned Principle</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: transparent;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px;
  }
  h1 {
    font-size: 1.15rem;
    margin: 0 0 4px;
    color: #1a1a1a;
  }
  p.sub {
    margin: 0 0 18px;
    color: #555;
    font-size: 0.92rem;
  }
  form {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #0b5fa5;
    box-shadow: 0 0 0 2px rgba(11,95,165,0.15);
  }
  button {
    padding: 10px 18px;
    font-size: 1rem;
    background: #0b5fa5;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #094a82; }
  #result {
    margin-top: 20px;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 0.98rem;
    display: none;
  }
  #result.found {
    display: block;
    background: #eaf4ea;
    border: 1px solid #bfe3bf;
    color: #245a24;
  }
  #result.notfound {
    display: block;
    background: #fbeaea;
    border: 1px solid #f0bcbc;
    color: #7a2323;
  }
  #result strong { display: block; margin-bottom: 4px; font-size: 1.05rem; }
  .footnote {
    margin-top: 16px;
    font-size: 0.78rem;
    color: #888;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Find your assigned design principle</h1>
  <p class="sub">Enter your student number to see your assigned section and design principle.</p>

  <form id="lookup-form" autocomplete="off">
    <input type="text" id="student-id" placeholder="e.g. S4263429" inputmode="numeric" />
    <button type="submit">Find</button>
  </form>

  <div id="result"></div>

  <p class="footnote">If your number isn't there, check for typos or ask your instructor.</p>
</div>

<script>
  // Each row: [Student ID, Section, Principle]
  const DATA = [
    ["S4263429","GD1D","Alignment"],
    ["S4254788","GD1D","Hierarchy"],
    ["S4255756","GD1D","Contrast"],
    ["S4235644","GD1C","Repetition"],
    ["S4214326","GD1C","Proximity"],
    ["S4252912","GD1C","Balance"],
    ["S4156436","GD1C","Negative Space"],
    ["S4224538","GD1D","Alignment"],
    ["S4286032","GD1C","Hierarchy"],
    ["S4284344","GD1C","Contrast"],
    ["S4281174","GD1C","Repetition"],
    ["S4243197","GD1D","Proximity"],
    ["S4256811","GD1D","Balance"],
    ["S4241293","GD1C","Negative Space"],
    ["S4249637","GD1D","Alignment"],
    ["S4196709","GD1D","Hierarchy"],
    ["S4171548","GD1C","Contrast"],
    ["S4037569","GD1C","Repetition"],
    ["S4268128","GD1C","Proximity"],
    ["S3840452","GD1D","Balance"],
    ["S4186004","GD1C","Negative Space"],
    ["S4027290","GD1D","Alignment"],
    ["S4114957","GD1D","Hierarchy"],
    ["S4284345","GD1C","Contrast"],
    ["S4190240","GD1C","Repetition"],
    ["S4280863","GD1C","Proximity"],
    ["S3843745","GD1C","Balance"],
    ["S4165524","GD1D","Negative Space"],
    ["S4263077","GD1C","Alignment"],
    ["S4279388","GD1C","Hierarchy"],
    ["S4284349","GD1C","Contrast"],
    ["S4249199","GD1C","Repetition"],
    ["S4256111","GD1D","Proximity"],
    ["S4266960","GD1C","Balance"],
    ["S4259141","GD1D","Negative Space"],
    ["S4207459","GD1C","Alignment"],
    ["S4276635","GD1C","Hierarchy"],
    ["S4261477","GD1D","Contrast"],
    ["S4289173","GD1D","Proximity"],
    ["S4256709","GD1D","Balance"],
    ["S4220204","GD1D","Negative Space"],
    ["S3786163","GD1D","Alignment"],
    ["S4264568","GD1D","Hierarchy"],
    ["S4235910","GD1D","Contrast"],
  ];

  // Normalise: uppercase, strip whitespace, strip a leading "S" so
  // students can type "S4263429" or just "4263429".
  function normalise(id) {
    return id.trim().toUpperCase().replace(/^S/, "").replace(/\s+/g, "");
  }

  const index = new Map();
  DATA.forEach(([id, section, principle]) => {
    index.set(normalise(id), { id, section, principle });
  });

  const form = document.getElementById("lookup-form");
  const input = document.getElementById("student-id");
  const result = document.getElementById("result");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const query = normalise(input.value);
    result.className = "";
    if (!query) {
      result.className = "notfound";
      result.innerHTML = "<strong>Enter a student number</strong>Type your student number above and select Find.";
      return;
    }
    const match = index.get(query);
    if (match) {
      result.className = "found";
      result.innerHTML =
        "<strong>" + match.id + "</strong>" +
        "Section: " + match.section + "<br>" +
        "Topic: " + match.principle;
    } else {
      result.className = "notfound";
      result.innerHTML = "<strong>Not found</strong>No match. Check for typos or ask your instructor.";
    }
  });
</script>
</body>
</html>
