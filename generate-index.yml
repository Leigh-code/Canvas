name: Generate Index
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Index
        run: |
          cd docs
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="en">'
            echo '<head>'
            echo '  <meta charset="UTF-8">'
            echo '  <meta name="viewport" content="width=device-width, initial-scale=1.0">'
            echo '  <title>Canvas Project Files</title>'
            echo '  <style>'
            echo '    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;max-width:800px;margin:40px auto;padding:20px;background:#f5f5f5;color:#333}'
            echo '    h1{color:#262626;border-bottom:3px solid #0d66d0;padding-bottom:10px}'
            echo '    ul{list-style:none;padding:0}'
            echo '    li{background:#fff;margin:10px 0;padding:15px 20px;border-radius:4px;border-left:4px solid #0d66d0;box-shadow:0 2px 4px rgba(0,0,0,.1)}'
            echo '    a{text-decoration:none;color:#0d66d0;font-size:16px;font-weight:500}'
            echo '    a:hover{color:#095aba;text-decoration:underline}'
            echo '  </style>'
            echo '</head>'
            echo '<body>'
            echo '  <h1>Canvas Project Files</h1>'
            echo '  <ul>'
            for file in $(ls *.html | grep -v "^index.html$" | sort); do
              title=$(grep -o -i -m1 '<title>[^<]*</title>' "$file" | sed -e 's/<[^>]*>//g')
              if [ -z "$title" ]; then title="$file"; fi
              echo "    <li><a href=\"$file\">$title</a></li>"
            done
            echo '  </ul>'
            echo '</body>'
            echo '</html>'
          } > index.html

      - name: Commit Changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add docs/index.html
          git diff --staged --quiet || git commit -m 'Automated index.html generation'
          git push
